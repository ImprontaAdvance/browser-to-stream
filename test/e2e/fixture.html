<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Browser to stream fixture</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      h1 {
        position: fixed;
        top: 42%;
        width: 100%;
        margin: 0;
        color: white;
        font: 700 52px sans-serif;
        text-align: center;
        text-shadow: 0 2px 8px black;
      }

      .marker {
        position: fixed;
        z-index: 2;
        width: 64px;
        height: 64px;
      }

      .top-left {
        top: 0;
        left: 0;
        background: rgb(255 0 0);
      }

      .top-right {
        top: 0;
        right: 0;
        background: rgb(0 255 0);
      }

      .bottom-left {
        bottom: 0;
        left: 0;
        background: rgb(0 0 255);
      }

      .bottom-right {
        right: 0;
        bottom: 0;
        background: rgb(255 255 0);
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <h1>FULL VIEWPORT</h1>
    <div class="marker top-left"></div>
    <div class="marker top-right"></div>
    <div class="marker bottom-left"></div>
    <div class="marker bottom-right"></div>
    <script>
      const canvas = document.querySelector("canvas");
      const context = canvas.getContext("2d");

      function render(timestamp) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        context.fillStyle = `hsl(${(timestamp / 20) % 360} 75% 42%)`;
        context.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      const audio = new AudioContext();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.frequency.value = 440;
      gain.gain.value = 0.12;
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start();
      void audio.resume();
    </script>
  </body>
</html>
